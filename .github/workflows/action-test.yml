name: Action

# Tests action.yml: with adder declared as a tool, built from this checkout, and with a release downloaded and
# verified, on each operating system.
on:
  pull_request:
    paths:
      - action.yml
      - .github/action/**
      - .github/workflows/action-test.yml
      - internal/cli/**
  push:
    branches: [main]
    paths:
      - action.yml
      - .github/action/**

permissions:
  contents: read

jobs:
  tool:
    name: As a tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Declare adder as a tool of an example, built from this checkout
        shell: bash
        run: |
          cp -R examples/registry-from-functions "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          go mod edit -require=typhonhill.dev/adder@v0.0.0 -replace="typhonhill.dev/adder=$GITHUB_WORKSPACE" -tool=typhonhill.dev/adder/cmd/adder
          go mod tidy
      - name: Check an example that is current
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/repo
      - name: Make an output out of date
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/repo/drivers/extra"
          printf 'package extra\n\nfunc New() {}\n' > "$RUNNER_TEMP/repo/drivers/extra/extra.go"
      - name: Check it again
        id: stale
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/repo
      - name: The second check fails
        if: steps.stale.outcome != 'failure'
        shell: bash
        run: |
          echo "::error::adder check passed on an out-of-date output"
          exit 1

  release:
    name: A release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify a release
        id: install
        shell: bash
        # Outside any Go module, as in a repository that does not declare adder as a tool.
        working-directory: ${{ runner.temp }}
        run: "$GITHUB_WORKSPACE/.github/action/install.sh"
        env:
          INPUT_VERSION: v1.1.3
          GH_TOKEN: ${{ github.token }}
      - name: The release runs
        shell: bash
        run: |
          "$ADDER" --version | grep -qx 'adder version v1.1.3'
        env:
          ADDER: ${{ steps.install.outputs.path }}
