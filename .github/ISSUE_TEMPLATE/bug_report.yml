name: Bug report
description: adder did something wrong, crashed, or reported a problem it should not have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, please report it privately instead, as [SECURITY.md](https://github.com/typhonhilldev/adder/blob/main/SECURITY.md) explains. For a question about using adder, ask in [Discussions](https://github.com/typhonhilldev/adder/discussions/categories/q-a).
  - type: input
    id: version
    attributes:
      label: adder version
      description: The output of `adder --version`, or `go tool adder --version`.
      placeholder: adder version v1.1.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How adder is installed
      options:
        - go get -tool (go tool adder)
        - A repository's own build with packs
        - go install
        - Homebrew
        - A release binary
        - The container image
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Go version and operating system
      description: The output of `go version`.
      placeholder: go version go1.27.3 darwin/arm64
  - type: textarea
    id: config
    attributes:
      label: adder.yaml
      description: The relevant part of `adder.yaml`, and of any template involved. Leave out anything private.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and everything it printed. `--json` output is welcome too.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true
